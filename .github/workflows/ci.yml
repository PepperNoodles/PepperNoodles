name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # The schema is the contract both sides validate against, so check it first:
  # if a migration will not apply, nothing downstream is worth running.
  # ---------------------------------------------------------------------------
  migrations:
    name: Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Apply every migration and the seed from scratch
        # seed.sql ends in row-count assertions, so a silently dropped insert
        # fails here rather than surfacing as missing data much later.
        run: supabase db reset

      # Note: there is deliberately no `supabase db diff` check here. After a
      # reset the database is built *from* the migrations, so a diff is
      # tautological. Real entity/migration drift is caught by the backend job,
      # which boots Hibernate with ddl-auto: validate against this same schema.

  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Testcontainers needs the image before the static initialiser runs;
      # pulling it up front keeps the first test from timing out.
      - name: Pull the PostGIS image
        run: docker pull postgis/postgis:17-3.5

      - name: Test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test

      - name: Package
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend lint, types and unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # The only job that proves the three tiers actually talk to each other.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [migrations, backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start Supabase and seed
        run: |
          supabase start
          supabase db reset
          # Publish the locally generated service_role key to later steps.
          echo "SUPABASE_SERVICE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d'\"' -f2)" >> "$GITHUB_ENV"

      - name: Build the backend
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Start the backend
        working-directory: backend
        env:
          # Image upload goes through Supabase Storage, which needs the
          # service_role key; without it every upload endpoint answers 502.
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
        run: |
          nohup java -jar target/*.jar > /tmp/backend.log 2>&1 &
          echo "Waiting for the API to come up…"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The backend did not start."
          tail -100 /tmp/backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the Playwright browser
        working-directory: frontend
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium

      - name: Build and start the frontend
        working-directory: frontend
        run: |
          npm run build
          nohup npm run start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The frontend did not start."
          tail -100 /tmp/frontend.log
          exit 1

      - name: Run the end-to-end suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Collect logs and traces on failure
        if: failure()
        run: |
          echo "===== backend ====="; tail -200 /tmp/backend.log || true
          echo "===== frontend ====="; tail -200 /tmp/frontend.log || true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

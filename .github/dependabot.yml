# Dependabot version updates.
#
# Only the directories that are actually built and deployed are listed.
# `legacy/` is deliberately absent: it is the 2021 codebase, kept as a porting
# reference, and it cannot be compiled or run. Note that leaving it out stops
# Dependabot opening *update* PRs against it but does not stop *alerts* — those
# come from the dependency graph — so its known-vulnerable dependencies are
# dismissed as not-used instead.
version: 2

updates:
  # --- backend ---------------------------------------------------------------
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      # One PR for the whole Spring release train; they are versioned together
      # and upgrading them piecemeal produces incompatible combinations.
      spring:
        patterns:
          - "org.springframework*:*"
          - "org.springframework.boot:*"
      # Everything else patch/minor in a single PR, so CI runs once.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # --- frontend --------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/test"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Both of these are blocked by what eslint-config-next bundles, not by
      # anything in this repo — its peer ranges are loose (eslint >=9,
      # typescript >=3.3.1) so npm installs happily and lint fails at runtime.
      #
      #   typescript 7.x  -> "typescript-eslint does not support TS 7.0"
      #                      (typescript-eslint 8.67.0 is the latest release
      #                       and still refuses it)
      #   eslint 10.x     -> eslint-plugin-react 7.37.5 calls
      #                      context.getFilename(), removed in ESLint 10
      #
      # Ignoring only the major bumps: patches and minors still come through.
      # Revisit when eslint-config-next ships newer transitive versions —
      # drop these entries and let Dependabot retry.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # @types/node describes the API surface of a *runtime*, so its major must
      # track the Node this project actually runs on — 22, in CI and locally.
      # Left alone Dependabot proposes the newest major (26), which type-checks
      # against APIs that do not exist at runtime, and tsc would not complain.
      # Bump this deliberately alongside NODE_VERSION in ci.yml.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  # --- CI ---------------------------------------------------------------------
  # Pinned action versions go stale silently; this is what caught the Node 20
  # deprecation warnings by hand last time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
